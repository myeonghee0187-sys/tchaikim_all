<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-QA5 — Shop / Detail 비교</title>
<style>body{margin:24px;background:#f5f3ee;color:#173a35;font:15px/1.6 system-ui}h1{font-size:22px}nav{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:20px}select{padding:10px;border:1px solid #aaa;background:white}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}figure{margin:0;min-width:0}figcaption{margin-bottom:8px}.frame{height:78vh;overflow:auto;background:#ddd}img{display:block;width:100%;height:auto}@media(max-width:600px){body{margin:12px}main{gap:8px}}</style></head>
<body><h1>Shop + Shop Detail — Post-QA5 비교</h1><p>Before: e553246 · After: 마지막 12개 수정. Desktop의 pin 구간은 전체 캡처에 여백으로 표시되므로 해당 section crop도 함께 확인하세요.</p>
<nav><label>페이지 <select id="page"><option value="shop">Shop</option><option value="shop-detail">Shop Detail</option></select></label><label>폭 <select id="width"><option>390</option><option>1024</option><option>1920</option></select></label><label>영역 <select id="section"></select></label><a href="REPORT.md">검증 보고서</a></nav>
<main><figure><figcaption>Before</figcaption><div class="frame"><a id="old_link"><img id="old" alt="수정 전 화면"></a></div></figure><figure><figcaption>After</figcaption><div class="frame"><a id="new_link"><img id="new" alt="수정 후 화면"></a></div></figure></main>
<script>const page=document.querySelector('#page'),width=document.querySelector('#width'),section=document.querySelector('#section');const sections={shop:['full','shop_more_button','motif_product_strip'],'shop-detail':['full','product_hero','narrative_copy','narrative_media','craft_media']};function show(){for(const [id,phase]of [['old','before'],['new','after']]){const url=phase+'/'+page.value+'/'+width.value+'-'+section.value+'.png';document.getElementById(id).src=url;document.getElementById(id+'_link').href=url;}}function select(){section.replaceChildren(...sections[page.value].map(v=>new Option(v,v)));show();}page.addEventListener('change',select);width.addEventListener('change',show);section.addEventListener('change',show);select();</script></body></html>
